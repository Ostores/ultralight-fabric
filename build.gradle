plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mods {
        "ultralight" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()   // API Luminescence (io.github.ayydxn:luminescence) installée localement
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Plus de `mappings` : depuis MC 26.x, Mojang publie un jar non obfusqué, donc ni yarn
    // ni intermediary. Les dépendances mod n'ont plus besoin d'être remappées non plus
    // (`implementation` au lieu de `modImplementation`).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // API Java Luminescence (LGPL-3.0) + icu4j : jar-in-jar (`include`) → nested, séparables
    // (LGPL-clean). Voir docs/Building pour installer l'API Luminescence en mavenLocal.
    implementation('io.github.ayydxn:luminescence:2026.1.0')
    include('io.github.ayydxn:luminescence:2026.1.0')
    implementation('com.ibm.icu:icu4j:78.3')
    include('com.ibm.icu:icu4j:78.3')
    // Les NATIFS (SDK Ultralight + pont JNI) ne sont PAS embarqués : téléchargés au runtime.
}

// Embarque l'attribution dans le jar (licence Ultralight Free : attribution requise).
processResources {
    from("NOTICES.md")
    from("LICENSE")
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

// Publication Maven locale — le mod consommateur référence ce mod via mavenLocal().
// Sans remapping (MC 26.x non obfusqué), le jar publié est directement consommable :
// plus besoin du -dev.jar intermediary d'autrefois.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId    = project.maven_group
            artifactId = project.archives_base_name
            version    = project.mod_version

            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
